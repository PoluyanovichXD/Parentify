{% extends "wrappers/auth.html" %}
{% block page %}
<section class="flex-grow flex items-center justify-center py-10 px-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 md:p-10 text-center">
        <div class="mb-8">
            <div class="w-20 h-20 bg-primary rounded-full flex items-center justify-center mx-auto mb-5">
                <i class="fas fa-lock text-white text-3xl"></i>
            </div>
            <h1 class="text-3xl font-bold mb-3">Вход в аккаунт</h1>
            <p class="text-gray-600">Введите ваши данные для входа в систему</p>
        </div>
        
        <form class="text-left" method="post">
            {% csrf_token %}
            <div class="mb-5">
                <label for="email" class="block font-medium mb-2">Email</label>
                <input 
                    name="email"
                    type="email" 
                    id="email" 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-colors" 
                    placeholder="Ваш email" 
                    required
                >
            </div>
            
            <div class="mb-5 relative">
                <label for="password" class="block font-medium mb-2">Пароль</label>
                <input 
                    name="password"
                    type="password" 
                    id="password" 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-colors pr-12" 
                    placeholder="Ваш пароль" 
                    required
                >
                <span class="absolute right-3 bottom-3 text-gray-500 cursor-pointer" id="togglePassword">
                    <i class="far fa-eye"></i>
                </span>
            </div>
            
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3 sm:gap-0">
                <div class="flex items-center">
                    <input 
                        type="checkbox" 
                        id="remember" 
                        class="mr-2 w-4 h-4 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary focus:ring-2"
                    >
                    <label for="remember" class="text-sm">Запомнить меня</label>
                </div>
                <a href="#" class="text-primary font-medium hover:underline text-sm">Забыли пароль?</a>
            </div>
            
            <button 
                type="submit" 
                class="w-full bg-primary text-white py-3 rounded-lg font-semibold hover:bg-[#e88d96] hover:-translate-y-0.5 transition-all duration-300 mb-4"
            >
                Войти
            </button>
            
            <!-- Раскомментируйте для входа через Google -->
            <!--
            <div class="flex items-center my-6">
                <div class="flex-grow border-t border-gray-300"></div>
                <span class="mx-4 text-gray-500 text-sm">или</span>
                <div class="flex-grow border-t border-gray-300"></div>
            </div>
            
            <button 
                type="button" 
                class="w-full bg-gray-100 text-gray-800 py-3 rounded-lg font-semibold hover:bg-gray-200 transition-all flex items-center justify-center gap-3"
            >
                <i class="fab fa-google"></i> Войти через Google
            </button>
            -->
        </form>
        
        <div class="mt-6 text-gray-600 text-sm">
            <p>Еще нет аккаунта? 
                <a href="register.html" class="text-primary font-medium hover:underline">Зарегистрироваться</a>
            </p>
        </div>
    </div>
</section>
<script>
    document.getElementById('togglePassword').addEventListener('click', function() {
        const passwordInput = document.getElementById('password');
        const icon = this.querySelector('i');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    });
    
    // document.querySelector('form').addEventListener('submit', function(e) {
    //     e.preventDefault();
        
    //     const email = document.getElementById('email').value;
    //     const password = document.getElementById('password').value;
        
    //     console.log('Вход выполнен:', { email, password });
    //     alert('Добро пожаловать! В реальном приложении здесь будет выполняться вход в систему.');
    // });
</script>
{% endblock %}
