{% extends "wrappers/auth.html" %}
{% block page %}
    <section class="flex-grow flex items-center justify-center py-10 px-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-8 md:p-10 text-center">
            <div class="mb-8">
                <div class="w-20 h-20 bg-primary rounded-full flex items-center justify-center mx-auto mb-5">
                    <i class="fas fa-user-plus text-white text-3xl"></i>
                </div>
                <h1 class="text-3xl font-bold mb-3">Создание аккаунта</h1>
                <p class="text-gray-600">Заполните данные для регистрации</p>
            </div>
            
            <form class="text-left">
                <!-- Имя и Фамилия в ряд -->
                <div class="flex flex-col md:flex-row gap-4 mb-5">
                    <div class="flex-1">
                        <label for="lastName" class="block font-medium mb-2">Фамилия</label>
                        <input 
                            type="text" 
                            id="lastName" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-colors" 
                            placeholder="Ваша фамилия" 
                            required
                        >
                    </div>
                    
                    <div class="flex-1">
                        <label for="firstName" class="block font-medium mb-2">Имя</label>
                        <input 
                            type="text" 
                            id="firstName" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-colors" 
                            placeholder="Ваше имя" 
                            required
                        >
                    </div>
                </div>

                <!-- Отчество -->
                <div class="mb-5">
                    <label for="middleName" class="block font-medium mb-2">Отчество</label>
                    <input 
                        type="text" 
                        id="middleName" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-colors" 
                        placeholder="Ваше отчество"
                    >
                </div>

                <!-- Пол -->
                <div class="mb-5">
                    <label class="block font-medium mb-3">Пол</label>
                    <div class="flex flex-col sm:flex-row gap-4">
                        <div class="flex items-center">
                            <input 
                                type="radio" 
                                id="male" 
                                name="gender" 
                                value="male"
                                class="w-4 h-4 text-primary bg-gray-100 border-gray-300 focus:ring-primary focus:ring-2"
                            >
                            <label for="male" class="ml-2">Мужской</label>
                        </div>
                        <div class="flex items-center">
                            <input 
                                type="radio" 
                                id="female" 
                                name="gender" 
                                value="female"
                                class="w-4 h-4 text-primary bg-gray-100 border-gray-300 focus:ring-primary focus:ring-2"
                            >
                            <label for="female" class="ml-2">Женский</label>
                        </div>
                    </div>
                </div>

                <!-- Email -->
                <div class="mb-5">
                    <label for="email" class="block font-medium mb-2">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-colors" 
                        placeholder="Ваш email" 
                        required
                    >
                </div>

                <!-- Пароль -->
                <div class="mb-5 relative">
                    <label for="password" class="block font-medium mb-2">Пароль</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-colors pr-12" 
                        placeholder="Придумайте пароль" 
                        required
                    >
                    <span class="absolute right-3 bottom-3 text-gray-500 cursor-pointer" id="togglePassword">
                        <i class="far fa-eye"></i>
                    </span>
                </div>

                <!-- Подтверждение пароля -->
                <div class="mb-5 relative">
                    <label for="confirmPassword" class="block font-medium mb-2">Подтверждение пароля</label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-colors pr-12" 
                        placeholder="Повторите пароль" 
                        required
                    >
                    <span class="absolute right-3 bottom-3 text-gray-500 cursor-pointer" id="toggleConfirmPassword">
                        <i class="far fa-eye"></i>
                    </span>
                </div>

                <!-- Соглашение -->
                <div class="mb-6 flex items-start">
                    <input 
                        type="checkbox" 
                        id="terms" 
                        required
                        class="w-4 h-4 text-primary bg-gray-100 border-gray-300 rounded focus:ring-primary focus:ring-2 mt-1 mr-3"
                    >
                    <label for="terms" class="text-sm text-gray-600">
                        Я соглашаюсь с <a href="#" class="text-primary font-medium hover:underline">условиями использования</a> 
                        и <a href="#" class="text-primary font-medium hover:underline">политикой конфиденциальности</a>
                    </label>
                </div>
                
                <!-- Кнопка регистрации -->
                <button 
                    type="submit" 
                    class="w-full bg-primary text-white py-3 rounded-lg font-semibold hover:bg-[#e88d96] hover:-translate-y-0.5 transition-all duration-300 mb-4"
                >
                    Зарегистрироваться
                </button>
                
                <!-- Раскомментируйте для регистрации через Google -->
                <!--
                <div class="flex items-center my-6">
                    <div class="flex-grow border-t border-gray-300"></div>
                    <span class="mx-4 text-gray-500 text-sm">или</span>
                    <div class="flex-grow border-t border-gray-300"></div>
                </div>
                
                <button 
                    type="button" 
                    class="w-full bg-gray-100 text-gray-800 py-3 rounded-lg font-semibold hover:bg-gray-200 transition-all flex items-center justify-center gap-3"
                >
                    <i class="fab fa-google"></i> Зарегистрироваться через Google
                </button>
                -->
            </form>
            
            <div class="mt-6 text-gray-600 text-sm">
                <p>Уже есть аккаунт? 
                    <a href="login.html" class="text-primary font-medium hover:underline">Войти</a>
                </p>
            </div>
        </div>
    </section>


    <script>
        // Функция для переключения видимости пароля
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
        
        // Функция для переключения видимости подтверждения пароля
        document.getElementById('toggleConfirmPassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('confirmPassword');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
        
        // Обработка формы
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Проверка совпадения паролей
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                alert('Пароли не совпадают!');
                return;
            }
            
            // Сбор данных формы
            const formData = {
                lastName: document.getElementById('lastName').value,
                firstName: document.getElementById('firstName').value,
                middleName: document.getElementById('middleName').value,
                gender: document.querySelector('input[name="gender"]:checked')?.value,
                email: document.getElementById('email').value,
                password: password
            };
            
            console.log('Регистрация:', formData);
            alert('Регистрация успешна! В реальном приложении здесь будет выполняться создание аккаунта.');
        });
    </script>
{% endblock %}
