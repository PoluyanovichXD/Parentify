<div>
    {% for val in value %}
    <label for="{{attrs.id}}" class="block font-medium mb-2">
        <span class="block text-sm font-semibold text-gray-700 mb-3 px-1">{{w.attrs.label}}
            <span class="text-red-500 ml-1">*</span>
        </span>
        <div class="relative">
            <input {% if w.attrs.multiply %} multiply {% endif %} 
                   id="{{attrs.id}}" 
                   name="{{name}}" 
                   value="{{val}}"
                   type="password"
                   class="password-field w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all duration-300 pr-12">
            <button type="button" 
                    class="password-toggle translate-y-[-50%] absolute right-3 top-1/2 transform text-gray-400 hover:text-gray-600 transition-all duration-300 hover:scale-110 active:scale-95"
                    onclick="
                        const passwordField = document.getElementById('{{attrs.id}}');
                        const icon = this.querySelector('i');
                        const isVisible = passwordField.type === 'text';
                        
                        if (isVisible) {
                            passwordField.type = 'password';
                            icon.classList.replace('fa-eye-slash', 'fa-eye');
                            this.classList.remove('text-secondary', 'hover:text-secondary-dark');
                            this.classList.add('text-gray-400', 'hover:text-gray-600');
                        } else {
                            passwordField.type = 'text';
                            icon.classList.replace('fa-eye', 'fa-eye-slash');
                            this.classList.remove('text-gray-400', 'hover:text-gray-600');
                            this.classList.add('text-secondary', 'hover:text-secondary-dark');
                        }
                    "
                    title="Показать/скрыть пароль">
                <i class="far fa-eye transition-all duration-300"></i>
            </button>
        </div>
    </label>
    {% endfor %}
</div>
