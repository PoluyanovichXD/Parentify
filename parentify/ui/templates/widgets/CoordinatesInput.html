<div>
    <label for="{{attrs.id}}" class="block font-medium mb-2">
        <span class="block text-sm font-semibold text-gray-700 mb-3 px-1">{{w.attrs.label}}
            <span class="text-red-500 ml-1">*</span>
        </span>
        <input autocomplete="off"
        data-inputmask="'regex': '^(\\-?\\d+\\.\\d+),(\\-?\\d+\\.\\d+)$'"
        id="{{attrs.id}}" 
        name="{{name}}" 
        value="{{value}}" 
        type="text" 
        placeholder=" " 
        {% if w.attrs.required %} required {% endif %} 
        {% if w.attrs.disabled %} disabled {% endif %}
            type="text"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-colors">
    </label>
</div>
