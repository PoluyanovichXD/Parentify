<div id="{{attrs.id}}-container">
    {% for val in value %}
    <div class="input-group mb-3">
        <label for="{{attrs.id}}-{{forloop.counter0}}" class="block font-medium mb-2 w-full">
            <span class="block text-sm font-semibold text-gray-700 mb-3 px-1">
                {{w.attrs.label}} {% if w.attrs.required %}<span class="text-red-500 ml-1">*</span>{% endif %}
            </span>
            <div class="flex gap-2">
                <input 
                    {% if w.attrs.multiply %} multiply {% endif %} 
                    id="{{attrs.id}}-{{forloop.counter0}}" 
                    name="{{name}}" 
                    value="{{val}}"
                    type="text"
                    class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-colors">
                
                {% if w.attrs.multiply %}
                <button type="button" 
                        class="remove-btn px-4 py-3 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors"
                        {% if forloop.first %}disabled{% endif %}>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                    </svg>
                </button>
                {% endif %}
            </div>
        </label>
    </div>
    {% endfor %}
    
    {% if w.attrs.multiply %}
    <button type="button" 
            id="{{attrs.id}}-add-btn"
            class="add-btn px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" />
        </svg>
        Добавить
    </button>
    {% endif %}
</div>

{% if w.attrs.multiply %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('{{attrs.id}}-container');
    const addBtn = document.getElementById('{{attrs.id}}-add-btn');
    let counter = {{ value|length|default:1 }};
    
    addBtn.addEventListener('click', function() {
        const newInput = document.createElement('div');
        newInput.className = 'input-group mb-3';
        newInput.innerHTML = `
            <label for="{{attrs.id}}-${counter}" class="block font-medium mb-2 w-full">
                <span class="block text-sm font-semibold text-gray-700 mb-3 px-1">
                    {{w.attrs.label}} {% if w.attrs.required %}<span class="text-red-500 ml-1">*</span>{% endif %}
                </span>
                <div class="flex gap-2">
                    <input 
                        multiply 
                        id="{{attrs.id}}-${counter}" 
                        name="{{name}}" 
                        value=""
                        type="text"
                        class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-colors">
                    
                    <button type="button" 
                            class="remove-btn px-4 py-3 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
            </label>
        `;
        
        container.insertBefore(newInput, addBtn);
        counter++;
        
        // Добавляем обработчик для новой кнопки удаления
        newInput.querySelector('.remove-btn').addEventListener('click', function() {
            newInput.remove();
        });
    });
    
    // Обработчики для существующих кнопок удаления
    container.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            this.closest('.input-group').remove();
        });
    });
});
</script>
{% endif %}
