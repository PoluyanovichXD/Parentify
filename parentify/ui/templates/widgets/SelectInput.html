{% load filter %}
{% for val in value %}
<div class="mb-6">
    <label for="{{attrs.id}}" class="block">
        {% if w.attrs.label %}
        <span class="block text-sm font-semibold text-gray-700 mb-3 px-1">
            {{w.attrs.label}}
            {% if w.attrs.required %}<span class="text-red-500 ml-1">*</span>{% endif %}
        </span>
        {% endif %}
        
        <div class="relative group">
            <select 
                id="{{attrs.id}}" 
                name="{{name}}" 
                {% if w.attrs.disabled %}disabled{% endif %}
                class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-gray-700 bg-white 
                       transition-all duration-300 appearance-none cursor-pointer
                       focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10
                       hover:border-gray-300 hover:shadow-sm
                       disabled:bg-gray-100 disabled:cursor-not-allowed disabled:opacity-60
                       pr-10"
                {% for k, v in w.attrs.items %} 
                    {% if k != 'class' and k != 'disabled' and k != 'label' and k != 'choices' and v %} 
                    {{k}}="{{v}}" 
                    {% endif %} 
                {% endfor %}>
                
                {% if attrs.placeholder and not attrs.choices and not w.attrs.choices %}
                    <option value="" disabled selected>{{ attrs.placeholder }}</option>
                {% endif %}
                
                {% if attrs.choices %}
                    {% for choice in attrs.choices %}
                        {% if choice.0 == None or choice.1 == '' %}
                            <option value="" class="text-gray-400" {% if not val %}selected{% endif %}>Не выбрано</option>
                        {% elif choice.1|is_list %}
                            <optgroup label="{{choice.0}}" class="text-sm font-semibold text-gray-700">
                                {% for prechoice in choice.1 %}
                                    {% if prechoice.0|to_str == val|to_str %}
                                        <option selected value="{{prechoice.0}}" class="py-2">{{prechoice.1}}</option>
                                    {% else %}
                                        <option value="{{prechoice.0}}" class="py-2">{{prechoice.1}}</option>
                                    {% endif %}
                                {% endfor %}
                            </optgroup>
                        {% elif choice.0|to_str == val|to_str %}
                            <option selected value="{{choice.0}}" class="py-2">{{choice.1}}</option>
                        {% else %}
                            <option value="{{choice.0}}" class="py-2">{{choice.1}}</option>
                        {% endif %}
                    {% endfor %}
                {% elif w.attrs.choices %}
                    {% for choice in w.attrs.choices %}
                        {% if choice.0 == None or choice.1 == '' %}
                            <option value="" class="text-gray-400" {% if not val %}selected{% endif %}>Не выбрано</option>
                        {% elif choice.1|is_list %}
                            <optgroup label="{{choice.0}}" class="text-sm font-semibold text-gray-700">
                                {% for prechoice in choice.1 %}
                                    {% if prechoice.0|to_str == val|to_str %}
                                        <option selected value="{{prechoice.0}}" class="py-2">{{prechoice.1}}</option>
                                    {% else %}
                                        <option value="{{prechoice.0}}" class="py-2">{{prechoice.1}}</option>
                                    {% endif %}
                                {% endfor %}
                            </optgroup>
                        {% elif choice.0|to_str == val|to_str %}
                            <option selected value="{{choice.0}}" class="py-2">{{choice.1}}</option>
                        {% else %}
                            <option value="{{choice.0}}" class="py-2">{{prechoice.1}}</option>
                        {% endif %}
                    {% endfor %}
                {% endif %}
            </select>
            
            <!-- Кастомная стрелка -->
            <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none">
                <svg class="w-5 h-5 text-gray-400 transition-transform duration-300 group-hover:text-gray-600 group-focus-within:text-primary" 
                     fill="none" 
                     stroke="currentColor" 
                     viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </div>
        </div>
        
        {% if w.attrs.help_text %}
        <p class="mt-2 text-sm text-gray-500">{{ w.attrs.help_text }}</p>
        {% endif %}
    </label>
</div>
{% endfor %}
