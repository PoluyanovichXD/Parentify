<div id="{{attrs.id}}-container">
    {% for val in value %}
    <div class="input-wrapper mb-4" data-index="{{ forloop.counter0 }}">
        <div class="flex items-center justify-between mb-2">
            <label for="{{attrs.id}}_{{ forloop.counter0 }}" class="block font-medium">
                <span class="block text-sm font-semibold text-gray-700 mb-3 px-1">
                    {{w.attrs.label}} {% if w.attrs.required %}<span class="text-red-500 ml-1">*</span>{% endif %}
                </span>
            </label>
            
            {% if w.attrs.multiply and forloop.counter0 > 0 %}
            <button type="button" 
                    onclick="removeTextarea('{{attrs.id}}', {{ forloop.counter0 }})"
                    class="text-red-500 hover:text-red-700 p-1 rounded-full hover:bg-red-50 transition-colors"
                    title="Удалить это поле">
                <i class="fas fa-times"></i>
            </button>
            {% endif %}
        </div>
        
        <textarea name="{{name}}" 
                  id="{{attrs.id}}_{{ forloop.counter0 }}"
                  autocomplete="off" 
                  type="text"
                  class="w-full mh-20 px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all duration-300 resize-vertical"
                  placeholder="{{w.attrs.label}}"
                  {% for k, v in w.attrs.items %} 
                      {% if v and k != 'id' %} 
                          {{k}}="{{v}}" 
                      {% endif %} 
                  {% endfor %}>{{val}}</textarea>
    </div>
    {% endfor %}
</div>

{% if w.attrs.multiply %}
<div class="mt-4">
    <button type="button" 
            onclick="addTextarea('{{attrs.id}}')"
            class="inline-flex items-center px-4 py-2 bg-primary text-white rounded-xl font-semibold hover:bg-primary-dark transition-all duration-300">
        <i class="fas fa-plus mr-2"></i>
        Добавить еще {{w.attrs.label|lower}}
    </button>
</div>

<script>
// Глобальная переменная для хранения индексов
if (!window.textareaCounters) {
    window.textareaCounters = {};
}
window.textareaCounters['{{attrs.id}}'] = {{ value|length|default:1 }};

function addTextarea(containerId) {
    const container = document.getElementById(containerId + '-container');
    if (!container) return;
    
    const index = window.textareaCounters[containerId] || 0;
    window.textareaCounters[containerId] = index + 1;
    
    // Создаем новый wrapper
    const wrapper = document.createElement('div');
    wrapper.className = 'input-wrapper mb-4';
    wrapper.setAttribute('data-index', index);
    
    // Создаем HTML для нового textarea
    wrapper.innerHTML = `
        <div class="flex items-center justify-between mb-2">
            <label for="${containerId}_${index}" class="block font-medium">
                <span class="block text-sm font-semibold text-gray-700 mb-3 px-1">
                    {{w.attrs.label}} {% if w.attrs.required %}<span class="text-red-500 ml-1">*</span>{% endif %}
                </span>
            </label>
            <button type="button" 
                    onclick="removeTextarea('${containerId}', ${index})"
                    class="text-red-500 hover:text-red-700 p-1 rounded-full hover:bg-red-50 transition-colors"
                    title="Удалить это поле">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <textarea name="{{name}}" 
                  id="${containerId}_${index}"
                  autocomplete="off" 
                  type="text"
                  class="w-full mh-20 px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all duration-300 resize-vertical"
                  placeholder="{{w.attrs.label}}"
                  {% for k, v in w.attrs.items %} 
                      {% if v and k != 'id' %} 
                          {{k}}="{{v}}" 
                      {% endif %} 
                  {% endfor %}></textarea>
    `;
    
    container.appendChild(wrapper);
    
    // Фокусируемся на новом textarea
    setTimeout(() => {
        const textarea = wrapper.querySelector('textarea');
        if (textarea) {
            textarea.focus();
        }
    }, 100);
}

function removeTextarea(containerId, index) {
    const container = document.getElementById(containerId + '-container');
    if (!container) return;
    
    const wrapper = container.querySelector(`.input-wrapper[data-index="${index}"]`);
    if (wrapper) {
        container.removeChild(wrapper);
    }
}
</script>
{% endif %}
